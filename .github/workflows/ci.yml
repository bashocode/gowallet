name: GoWallet CI Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'microservices/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop, master, 'feature/**' ]
    paths:
      - 'microservices/**'
      - '.github/workflows/**'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  # Job 1: Linting Check
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m ./api-gateway/... ./audit-service/... ./auth-service/... ./ledger-service/... ./notification-service/... ./payment-service/... ./scheduler-service/... ./shared/... ./transaction-service/... ./user-service/... ./wallet-service/...
          working-directory: microservices

  # Job 2: Run Unit Tests & Coverage (`make test`)
  test:
    name: Automated Unit Testing
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: microservices

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: gowallet_test
          MYSQL_USER: gowallet_user
          MYSQL_PASSWORD: gowallet_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run `make test`
        run: |
          go test -v -coverprofile=coverage.out ./...
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: microservices/coverage.out

  # Job 3: SonarQube Scanner Integration (from Episode 57)
  sonarqube:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: microservices

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          projectBaseDir: microservices
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
