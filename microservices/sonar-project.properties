# ==============================================================================
# SONARQUBE PROJECT CONFIGURATION
# ==============================================================================
# This file configures SonarQube static code analysis for the GoWallet microservices project.
# It can be used locally or in CI/CD pipelines (GitHub Actions).

# Project identification
sonar.projectKey=gowallet
sonar.projectName=GoWallet Microservices
sonar.projectVersion=1.0

# Source code directories
# Scan all Go source files in the microservices project
sonar.sources=.

# Exclusions from source analysis
# Exclude test files, vendor dependencies, generated docs, proto files, and build artifacts
sonar.exclusions=**/*_test.go,**/vendor/**,**/docs/**,**/proto/**,**/*.pb.go,**/bin/**,**/.git/**,**/node_modules/**,**/certs/**,**/db-init/**

# Test configuration
# Define where test files are located
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/vendor/**

# Go Coverage Integration
# Path to the coverage report generated by: go test ./... -coverprofile=coverage.out
sonar.go.coverage.reportPaths=coverage.out

# Source encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=go

# Additional settings for better analysis
sonar.go.govet.reportPaths=govet-report.out
sonar.go.golangci-lint.reportPaths=golangci-lint-report.out
