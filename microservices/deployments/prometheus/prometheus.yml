global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8081']

  - job_name: 'wallet-service'
    static_configs:
      - targets: ['wallet-service:8082']

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:8083']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8084']

  - job_name: 'ledger-service'
    static_configs:
      - targets: ['ledger-service:8085']

  - job_name: 'transaction-service'
    static_configs:
      - targets: ['transaction-service:8086']
      