services:
  # === Infrastructure ===
  mysql:
    image: mysql:8.0
    container_name: gowallet-mysql-ms
    command: >
      --slow_query_log=1
      --long_query_time=0.5
      --log_queries_not_using_indexes=1
      --slow_query_log_file=/var/lib/mysql/mysql-slow.log
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME_DEFAULT}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:${DB_PORT}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - gowallet-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gowallet-redis-ms
    ports:
      - "127.0.0.1:${REDIS_PORT}:${REDIS_PORT}"
    networks:
      - gowallet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: gowallet-mailhog-ms
    ports:
      - "127.0.0.1:${MAILHOG_PORT}:${MAILHOG_PORT}" # SMTP port
      - "127.0.0.1:${MAILHOG_WEB_PORT}:${MAILHOG_WEB_PORT}" # Web UI dashboard port
    networks:
      - gowallet-network
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gowallet-rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:${RABBITMQ_PORT}"     # AMQP port for application connections
      - "127.0.0.1:${RABBITMQ_MGMT_PORT}:${RABBITMQ_MGMT_PORT}"   # Web UI Management Console port
    networks:
      - gowallet-network
    restart: always

  mongodb:
    image: mongo:7.0
    container_name: gowallet-mongodb
    ports:
      - "127.0.0.1:${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - mongo_data:/data/db
    networks:
      - gowallet-network
    restart: always

  minio:
    image: minio/minio:latest
    container_name: gowallet-minio
    command: server /data --console-address ":${MINIO_WEB_PORT}"
    ports:
      - "127.0.0.1:${MINIO_PORT}:${MINIO_PORT}"
      - "127.0.0.1:${MINIO_WEB_PORT}:${MINIO_WEB_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - gowallet-network
    restart: always

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: gowallet-stripe-cli
    command: listen --forward-to http://api-gateway:${GATEWAY_PORT}/api/v1/payments/webhook --api-key ${STRIPE_SECRET_KEY}
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_DEVICE_NAME=gowallet-docker
    depends_on:
      - payment-service
      - api-gateway
    networks:
      - gowallet-network
    restart: unless-stopped
  
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: gowallet-jaeger
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT}:${JAEGER_UI_PORT}"
      - "127.0.0.1:${JAEGER_GRPC_PORT}:${JAEGER_GRPC_PORT}"
      - "127.0.0.1:${JAEGER_HTTP_PORT}:${JAEGER_HTTP_PORT}"
    networks:
      - gowallet-network
    restart: always

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: gowallet-prometheus
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
    networks:
      - gowallet-network
    restart: always

  grafana:
    image: grafana/grafana:10.3.3
    container_name: gowallet-grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:${GRAFANA_PORT}"
    networks:
      - gowallet-network
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: gowallet-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT}:${ELASTICSEARCH_PORT}"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - gowallet-network
    restart: always

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: gowallet-logstash
    volumes:
      - ./deployments/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "127.0.0.1:${LOGSTASH_PORT}:${LOGSTASH_PORT}"
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    depends_on:
      - elasticsearch
    networks:
      - gowallet-network
    restart: always

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: gowallet-kibana
    ports:
      - "127.0.0.1:${KIBANA_PORT}:${KIBANA_PORT}"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:${ELASTICSEARCH_PORT}
    depends_on:
      - elasticsearch
    networks:
      - gowallet-network
    restart: always

  # === Application Services ===
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: gowallet-api-gateway-ms
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      APP_ENV: ${APP_ENV}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      WALLET_SERVICE_URL: ${WALLET_SERVICE_URL}
      LEDGER_SERVICE_URL: ${LEDGER_SERVICE_URL}
      TRANSACTION_SERVICE_URL: ${TRANSACTION_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      WEBSOCKET_CHANNEL: ${WEBSOCKET_CHANNEL}
      OTEL_COLLECTOR_ADDR: ${OTEL_COLLECTOR_ADDR}
      LOGSTASH_ADDR: ${LOGSTASH_ADDR}
      GRPC_SSL_CA_PATH: /certs/ca.crt
      GRPC_SSL_CERT_PATH: /certs/api-gateway.crt
      GRPC_SSL_KEY_PATH: /certs/api-gateway.key
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/api-gateway.crt:/certs/api-gateway.crt:ro
      - ./certs/api-gateway.key:/certs/api-gateway.key:ro
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      wallet-service:
        condition: service_started
      ledger-service:
        condition: service_started
      transaction-service:
        condition: service_started
      payment-service:
        condition: service_started
      scheduler-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - gowallet-network
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: gowallet-auth-service-ms
    ports:
      - "127.0.0.1:${AUTH_PORT}:${AUTH_PORT}"
      - "127.0.0.1:${AUTH_GRPC_PORT}:${AUTH_GRPC_PORT}"
    environment:
      - APP_ENV=${APP_ENV}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_AUTH}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - USER_GRPC_ADDR=${USER_GRPC_ADDR}
      - WALLET_GRPC_ADDR=${WALLET_GRPC_ADDR}
      - AUTH_GRPC_ADDR=${AUTH_GRPC_ADDR}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
      - OTEL_COLLECTOR_ADDR=${OTEL_COLLECTOR_ADDR}
      - LOGSTASH_ADDR=${LOGSTASH_ADDR}
      - GRPC_SSL_CA_PATH=/certs/ca.crt
      - GRPC_SSL_CERT_PATH=/certs/auth-service.crt
      - GRPC_SSL_KEY_PATH=/certs/auth-service.key
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/auth-service.crt:/certs/auth-service.crt:ro
      - ./certs/auth-service.key:/certs/auth-service.key:ro
    depends_on:
      - mysql
      - redis
      - user-service
    networks:
      - gowallet-network
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: gowallet-user-service-ms
    ports:
      - "127.0.0.1:${USER_PORT}:${USER_PORT}"
    environment:
      - APP_ENV=${APP_ENV}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_USER}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_FROM=${SMTP_FROM}
      - WALLET_GRPC_ADDR=${WALLET_GRPC_ADDR}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - LOGSTASH_ADDR=${LOGSTASH_ADDR}
      - GRPC_SSL_CA_PATH=/certs/ca.crt
      - GRPC_SSL_CERT_PATH=/certs/user-service.crt
      - GRPC_SSL_KEY_PATH=/certs/user-service.key
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/user-service.crt:/certs/user-service.crt:ro
      - ./certs/user-service.key:/certs/user-service.key:ro
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - minio
    networks:
      - gowallet-network
    restart: unless-stopped

  wallet-service:
    build:
      context: .
      dockerfile: wallet-service/Dockerfile
    container_name: gowallet-wallet-service-ms
    ports:
      - "127.0.0.1:${WALLET_PORT}:${WALLET_PORT}"
      - "127.0.0.1:${WALLET_GRPC_PORT}:${WALLET_GRPC_PORT}"
    environment:
      - APP_ENV=${APP_ENV}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_WALLET}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_COLLECTOR_ADDR=${OTEL_COLLECTOR_ADDR}
      - LOGSTASH_ADDR=${LOGSTASH_ADDR}
      - GRPC_SSL_CA_PATH=/certs/ca.crt
      - GRPC_SSL_CERT_PATH=/certs/wallet-service.crt
      - GRPC_SSL_KEY_PATH=/certs/wallet-service.key
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/wallet-service.crt:/certs/wallet-service.crt:ro
      - ./certs/wallet-service.key:/certs/wallet-service.key:ro
    depends_on:
      - mysql
      - redis
    networks:
      - gowallet-network
    restart: unless-stopped
  
  ledger-service:
    build:
      context: .
      dockerfile: ledger-service/Dockerfile
    container_name: gowallet-ledger-service-ms
    ports:
      - "127.0.0.1:${LEDGER_PORT}:${LEDGER_PORT}"
      - "127.0.0.1:${LEDGER_GRPC_PORT}:${LEDGER_GRPC_PORT}"
    environment:
      - APP_ENV=${APP_ENV}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_LEDGER}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - WALLET_GRPC_ADDR=${WALLET_GRPC_ADDR}
      - LOGSTASH_ADDR=${LOGSTASH_ADDR}
      - GRPC_SSL_CA_PATH=/certs/ca.crt
      - GRPC_SSL_CERT_PATH=/certs/ledger-service.crt
      - GRPC_SSL_KEY_PATH=/certs/ledger-service.key
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/ledger-service.crt:/certs/ledger-service.crt:ro
      - ./certs/ledger-service.key:/certs/ledger-service.key:ro
    depends_on:
      - mysql
      - redis
    networks:
      - gowallet-network
    restart: unless-stopped
  
  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: gowallet-transaction-service-ms
    ports:
      - "127.0.0.1:${TRANSACTION_PORT}:${TRANSACTION_PORT}"
      - "127.0.0.1:${TRANSACTION_GRPC_PORT}:${TRANSACTION_GRPC_PORT}"
    environment:
      - APP_ENV=${APP_ENV}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_TRANSACTION}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - USER_GRPC_ADDR=${USER_GRPC_ADDR}
      - WALLET_GRPC_ADDR=${WALLET_GRPC_ADDR}
      - LEDGER_GRPC_ADDR=${LEDGER_GRPC_ADDR}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MONOLITH_BASE_URL=${MONOLITH_BASE_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - GATEWAY_CALLBACK_URL=${GATEWAY_CALLBACK_URL}
      - LOGSTASH_ADDR=${LOGSTASH_ADDR}
      - GRPC_SSL_CA_PATH=/certs/ca.crt
      - GRPC_SSL_CERT_PATH=/certs/transaction-service.crt
      - GRPC_SSL_KEY_PATH=/certs/transaction-service.key
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/transaction-service.crt:/certs/transaction-service.crt:ro
      - ./certs/transaction-service.key:/certs/transaction-service.key:ro
    depends_on:
      - mysql
      - redis
      - user-service
      - wallet-service
      - ledger-service
    networks:
      - gowallet-network
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: gowallet-payment-service-ms
    ports:
      - "127.0.0.1:${PAYMENT_PORT}:${PAYMENT_PORT}"
      - "127.0.0.1:${PAYMENT_GRPC_PORT}:${PAYMENT_GRPC_PORT}"
    environment:
      - APP_ENV=${APP_ENV}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_PAYMENT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - TRANSACTION_GRPC_ADDR=${TRANSACTION_GRPC_ADDR}
      - BASE_URL=${BASE_URL}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - LOGSTASH_ADDR=${LOGSTASH_ADDR}
      - GRPC_SSL_CA_PATH=/certs/ca.crt
      - GRPC_SSL_CERT_PATH=/certs/payment-service.crt
      - GRPC_SSL_KEY_PATH=/certs/payment-service.key
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/payment-service.crt:/certs/payment-service.crt:ro
      - ./certs/payment-service.key:/certs/payment-service.key:ro
    depends_on:
      - mysql
      - redis
      - transaction-service
    networks:
      - gowallet-network
    restart: unless-stopped

  scheduler-service:
    build:
      context: .
      dockerfile: scheduler-service/Dockerfile
    container_name: gowallet-scheduler-service-ms
    environment:
      - APP_ENV=${APP_ENV}
      - AUTH_GRPC_ADDR=${AUTH_GRPC_ADDR}
      - USER_GRPC_ADDR=${USER_GRPC_ADDR}
      - WALLET_GRPC_ADDR=${WALLET_GRPC_ADDR}
      - TRANSACTION_GRPC_ADDR=${TRANSACTION_GRPC_ADDR}
      - PAYMENT_GRPC_ADDR=${PAYMENT_GRPC_ADDR}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - OUTBOX_ARCHIVE_AGE=${OUTBOX_ARCHIVE_AGE}
      - JWT_SECRET=${JWT_SECRET}
      - LOGSTASH_ADDR=${LOGSTASH_ADDR}
      - GRPC_SSL_CA_PATH=/certs/ca.crt
      - GRPC_SSL_CERT_PATH=/certs/scheduler-service.crt
      - GRPC_SSL_KEY_PATH=/certs/scheduler-service.key
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/scheduler-service.crt:/certs/scheduler-service.crt:ro
      - ./certs/scheduler-service.key:/certs/scheduler-service.key:ro
    depends_on:
      - auth-service
      - user-service
      - wallet-service
      - transaction-service
    networks:
      - gowallet-network
    restart: unless-stopped
  
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: gowallet-notification-service-ms
    environment:
      - APP_ENV=${APP_ENV}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_NOTIFICATION}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - USER_GRPC_ADDR=${USER_GRPC_ADDR}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - WEBSOCKET_CHANNEL=${WEBSOCKET_CHANNEL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_FROM=${SMTP_FROM}
      - JWT_SECRET=${JWT_SECRET}
      - LOGSTASH_ADDR=${LOGSTASH_ADDR}
      - GRPC_SSL_CA_PATH=/certs/ca.crt
      - GRPC_SSL_CERT_PATH=/certs/notification-service.crt
      - GRPC_SSL_KEY_PATH=/certs/notification-service.key
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/notification-service.crt:/certs/notification-service.crt:ro
      - ./certs/notification-service.key:/certs/notification-service.key:ro
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - payment-service
      - user-service
    networks:
      - gowallet-network
    restart: unless-stopped

  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    container_name: gowallet-audit-service-ms
    environment:
      - APP_ENV=${APP_ENV}
      - MONGO_URL=${MONGO_URL}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
      - rabbitmq
      - payment-service
    networks:
      - gowallet-network
    restart: unless-stopped

volumes:
  mysql_data:
  mongo_data:
  minio_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  gowallet-network:
    driver: bridge
